<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <link rel="stylesheet" href="Login.css">
</head>
<body>
    <div class="_08-login-logout">
        <div class="cards">
            <div class="side-bar">
            <div class="user">
                <div class="user2">
                <div class="ellipse-1"></div>
                <div class="id">User</div>
                </div>
                <div class="button">
                <div class="review">Logout</div>
                </div>
            </div>
            <div class="menu">
                <div class="menu2">Menu</div>
                <div class="frame-1">
                <div class="product-registration">Product Registration</div>
                <img class="play-arrow" src="play-arrow0.svg" />
                </div>
                <div class="frame-2">
                <div class="product-list">Product List</div>
                <img class="play-arrow2" src="play-arrow1.svg" />
                </div>
                <div class="frame-3">
                <div class="cart">Cart</div>
                <img class="play-arrow3" src="play-arrow2.svg" />
                </div>
                <div class="frame-4">
                <div class="review-writing">Review Writing</div>
                <img class="play-arrow4" src="play-arrow3.svg" />
                </div>
            </div>
            <div class="menu">
                <div class="my-page">My Page</div>
                <div class="frame-1">
                <div class="signup">Signup</div>
                <img class="play-arrow5" src="play-arrow4.svg" />
                </div>
                <div class="frame-2">
                <div class="login-logout">Login/Logout</div>
                <img class="play-arrow6" src="play-arrow5.svg" />
                </div>
                <div class="frame-3">
                <div class="account">Account</div>
                <img class="play-arrow7" src="play-arrow6.svg" />
                </div>
            </div>
            </div>
            <div class="frame-5">
            <div class="frame-32">
                <div class="upper-bar">
                <div class="bottom-app-bar">
                    <div class="leading-icon">
                    <div class="icon-1">
                        <div class="container">
                        <div class="state-layer">
                            <img class="icon" src="icon0.svg" />
                        </div>
                        </div>
                    </div>
                    </div>
                </div>
                <div class="cart2">
                    <img class="shopping-cart" src="shopping-cart0.svg" />
                </div>
                </div>
                <div class="bar">
                <div class="product-list2">PRODUCT LIST</div>
                <div class="product-registration2">PRODUCT REGISTRATION</div>
                <div class="review-list">REVIEW LIST</div>
                <div class="review-writing2">REVIEW WRITING</div>
                <div class="login-logout2">LOGIN/LOGOUT</div>
                </div>
            </div>
            <div class="descrption">
                <div class="title">
                <div class="title-button">
                    <div class="review2">LOGIN</div>
                </div>
                <div class="div">로그인/로그아웃</div>
                </div>
                <div class="login-section">
                <div class="summary">
                    <div class="title2">LOGIN</div>
                    <img class="div2" src="div1.svg" />
                    <div class="id2">
                    <div class="title3">ID</div>
                    <div class="search">
                        <div class="value">input ID</div>
                    </div>
                    </div>
                    <div class="pw">
                    <div class="title3">PW</div>
                    <div class="search2">
                        <div class="input-pw">input PW</div>
                        <div class="eye">
                        <img class="eye-off" src="eye-off0.svg" />
                        </div>
                    </div>
                    </div>
                </div>
                <div class="button-section">
                    <div class="button2">
                    <div class="title4">아이디 찾기</div>
                    </div>
                    <div class="button2">
                    <div class="title4">비밀번호 찾기</div>
                    </div>
                    <div class="button3">
                    <div class="title2">로그아웃</div>
                    </div>
                </div>
                </div>
            </div>
            </div>
        </div>
    </div>

        // JS 동작 필요 시 여기에 작성
