{% extends "index.html" %}
{% block content %}
<form method="post" action="{{ url_for('signup') }}"><section class="white-card form-card"><div class="form-grid"><label for="email">Email</label><input type="email" id="email" name="email" placeholder="example@ewha.ac.kr" required><label for="username">ID</label><div><div class="input-group"><input id="username" name="username" pattern="[A-Za-z0-9_]{3,30}" placeholder="영문, 숫자, 밑줄 3~30자" required><button class="pill pill-green" type="button" data-check-id>중복 확인</button></div><p class="file-caption" id="id-check-message" aria-live="polite"></p></div><label for="password">PW<small>대문자와 소문자, 숫자를 모두 포함하여 10자 이상</small></label><div class="password-field"><input type="password" id="password" name="password" minlength="10" required autocomplete="new-password"><button class="icon-button" type="button" data-toggle-password="password" aria-label="비밀번호 보기">{{ icon('eye') }}</button></div><label for="password_confirm">PW 확인</label><div class="password-field"><input type="password" id="password_confirm" name="password_confirm" minlength="10" required autocomplete="new-password"><button class="icon-button" type="button" data-toggle-password="password_confirm" aria-label="비밀번호 확인 보기">{{ icon('eye') }}</button></div><div class="field-label">이화인 인증<small>인증 화면 사진을 넣을 자리입니다.<br>현재 실습에서는 실제 학생 인증을 처리하지 않습니다.</small></div><div class="upload-control" data-upload><div class="photo-pair"><div class="photo-slot light"><img data-preview alt="인증 화면 미리보기" hidden></div><label class="photo-slot upload-tile" for="verification_photo">{{ icon('plus') }}<span>사진 미리보기<br>파일 불러오기</span><input type="file" id="verification_photo" accept="image/png,image/jpeg,image/gif,image/webp"></label></div><p class="file-caption" data-file-name>선택한 파일이 없습니다.</p></div><label for="name">이름</label><input id="name" name="name" placeholder="이름" required><label for="student_id">학번</label><input id="student_id" name="student_id" inputmode="numeric" pattern="[0-9]+" placeholder="학번" required></div></section><div class="form-actions"><a class="btn btn-white" href="{{ url_for('login') }}">로그인으로</a><button class="btn" type="submit">회원가입</button></div></form>
{% endblock %}
