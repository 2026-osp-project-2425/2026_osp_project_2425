{% extends "index.html" %}
{% block content %}
<div class="review-page"><form class="product-select" method="get"><label for="product_id">상품 선택</label><select id="product_id" name="product_id" data-auto-submit>{% for p in products %}<option value="{{ p.id }}" {{ 'selected' if p.id==product.id }}>{{ p.name }}</option>{% endfor %}</select><button class="sr-only" type="submit">상품 선택 적용</button></form>{{ review_product(product,true) }}<form action="{{ url_for('reg_review') }}" method="post" enctype="multipart/form-data" data-draft="review"><input type="hidden" name="product_id" value="{{ product.id }}"><section class="white-card review-detail"><label class="sr-only" for="title">리뷰 제목</label><input class="title-input" id="title" name="title" placeholder="제목 작성" required><p class="small muted">{{ user.username if user else 'User' }}</p><div class="form-grid"><label for="rating">평점</label><div class="rating-input"><span class="stars" aria-hidden="true">★★★★★</span><select id="rating" name="rating"><option value="5">5.0 · 아주 만족해요</option><option value="4">4.0 · 만족해요</option><option value="3">3.0 · 보통이에요</option><option value="2">2.0 · 아쉬워요</option><option value="1">1.0 · 불만족해요</option></select></div><label for="review_file">리뷰 사진 <small>(선택)</small></label><div class="upload-control" data-upload><div class="photo-pair"><div class="photo-slot light"><img data-preview alt="선택한 리뷰 사진" hidden></div><label class="photo-slot upload-tile" for="review_file">{{ icon('plus') }}<span>드래그 앤 드롭 또는<br>파일 불러오기</span><input type="file" id="review_file" name="file_input" accept="image/png,image/jpeg,image/gif,image/webp"></label></div><p class="file-caption" data-file-name>선택한 파일이 없습니다.</p></div><label for="description">리뷰 상세</label><textarea id="description" name="description" rows="5" placeholder="상품 사용 후기를 작성해 주세요" required></textarea></div></section><div class="form-actions"><p class="muted small" data-draft-status aria-live="polite"></p><button class="btn btn-white" type="button" data-save-draft>임시 저장하기</button><button class="btn" type="submit">리뷰 등록하기</button></div></form></div>
{% endblock %}
