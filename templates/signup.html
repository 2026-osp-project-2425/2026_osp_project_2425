{% extends "index.html" %}
{% block content %}
<form class="centered-form signup-card" method="post" action="{{ url_for('signup') }}">
    <section class="signup-section">
        <h2>계정 정보 <span class="required-tag">필수</span></h2>
        <label class="field">이름<input id="name" name="name" placeholder="이름" autocomplete="name" required></label>
        <label class="field">닉네임<input id="nickname" name="nickname" placeholder="닉네임" maxlength="30" required></label>
        <label class="field">이메일<input type="email" id="email" name="email" placeholder="example@ewha.ac.kr" autocomplete="email" required></label>
        <div class="field"><label for="username">아이디</label>
            <div class="id-row"><input id="username" name="username" pattern="[A-Za-z0-9_]{3,30}" placeholder="영문, 숫자, 밑줄 3~30자" autocomplete="username" required><button class="id-check-button" type="button" data-check-id="{{ url_for('check_id') }}">중복 확인</button></div>
            <span class="id-check" id="id-check-message" aria-live="polite"></span>
        </div>
        <div class="field"><label for="password">비밀번호</label><div class="password-field"><input type="password" id="password" name="password" minlength="10" required autocomplete="new-password"><button class="icon-button" type="button" data-toggle-password="password" aria-label="비밀번호 보기">{{ icon('eye') }}</button></div></div>
        <div class="password-rules" data-password-rules="password"><span data-rule="length">10자 이상</span><span data-rule="case">대·소문자</span><span data-rule="digit">숫자 포함</span></div>
        <div class="field"><label for="password_confirm">비밀번호 확인</label><div class="password-field"><input type="password" id="password_confirm" name="password_confirm" minlength="10" required autocomplete="new-password"><button class="icon-button" type="button" data-toggle-password="password_confirm" aria-label="비밀번호 확인 보기">{{ icon('eye') }}</button></div></div>
    </section>
    <section class="signup-section">
        <h2>이화인 인증 <span class="required-tag">필수</span></h2>
        <div class="verify-row upload-control" data-upload>
            <div class="upload-row">
                <div class="upload-preview only-selected"><img data-preview alt="선택한 학생증 사진" hidden></div>
                <label class="upload-add" for="verification_photo">+ 사진<input type="file" id="verification_photo" accept="image/png,image/jpeg,image/gif,image/webp" required></label>
            </div>
            <div class="verify-text"><span>학생증 사진</span><p>학생증 사진을 올리면 이화인 인증이 진행돼요. 실습에서는 실제 인증을 처리하지 않아요.</p><p class="file-caption" data-file-name>선택한 파일이 없습니다.</p></div>
        </div>
    </section>
    <section class="signup-section">
        <label class="field"><span class="field-title">학번 <span class="optional-tag">선택</span></span><input id="student_id" name="student_id" inputmode="numeric" pattern="[0-9]+" placeholder="학번"></label>
        <label class="field"><span class="field-title">전화번호 <span class="optional-tag">선택</span></span><input type="tel" id="phone" name="phone" placeholder="010-0000-0000"></label>
    </section>
    <div class="signup-submit">
        <button class="btn" type="submit">회원가입</button>
        <p>이미 계정이 있나요? <a href="{{ url_for('login') }}">로그인</a></p>
    </div>
</form>
{% endblock %}
